[project]
name = "aipager"
version = "0.7.1"
description = "Telegram remote-control daemon for Claude Code CLI sessions running in dtach"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dev-aly3n", email = "66creation@gmail.com" }]
keywords = ["claude", "claude-code", "telegram", "remote-control", "dtach", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    # [rate-limiter] pulls aiolimiter, which backs AIORateLimiter. Not
    # optional in practice: without it every send hits Telegram unthrottled
    # and a flood-control penalty surfaces as an unhandled RetryAfter at each
    # of ~64 call sites. See bot/lifecycle.py's rate_limiter() call.
    "python-telegram-bot[rate-limiter]>=20",
    "httpx>=0.24",
    "dtach-bin>=0.9.1",
    "rich>=14.0,<16",
    "questionary>=2.0,<3",
    "PyYAML>=6.0,<7",
    # Powers the Mini App server. NOT optional: it used to be an extra,
    # and the result was that anyone who ran a plain `pip install
    # aipager` and then `aipager miniapp enable` got a Mini App that
    # could never start, with the real reason buried in a daemon log.
    # It costs ~10 MB (aiohttp + multidict, frozenlist, yarl, attrs,
    # propcache, aiosignal, aiohappyeyeballs) on a ~42 MB base — for
    # comparison, the setup wizard's terminal colours cost ~21 MB, twice
    # as much, and pygments alone is 9.4 MB. Optimising this away while
    # keeping a syntax highlighter was the wrong trade.
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "build", "twine"]
# Voice input support — install with `pip install 'aipager[voice]'` /
# `uv tool install 'aipager[voice]'`. faster-whisper transitively pulls
# ctranslate2 (~60 MB), onnxruntime (~55 MB), av, numpy and tokenizers,
# so the on-disk install bumps by ~200 MB. Plus a ~74 MB model download
# on first voice message (cached under ~/.cache/huggingface/hub).
# Kept optional because ~200 MB is a genuinely different order of
# cost from aiohttp's ~10 MB on a ~42 MB base. (An older version of
# this comment claimed the base install was ~3 MB. It never was —
# that figure was wrong by 14x and is most likely why the Mini App
# was made optional in the first place.)
voice = ["faster-whisper>=1.0"]
# Compatibility alias, deliberately empty. aiohttp moved into the base
# dependencies above, but `aipager[miniapp]` appears in this repo's docs
# and CHANGELOG, in released error messages, and in users' notes and
# shell history. Removing the extra outright would make every one of
# those fail with "unknown extra"; an empty extra keeps them all working
# and installs exactly the same thing. Do not delete.
#
# (The Mini App server itself is still OFF by default — see
# aipager.config.MINIAPP_ENABLED. This is about the dependency being
# present, not the feature being on.)
miniapp = []

[project.scripts]
aipager            = "aipager.cli:main"
# Internal hooks invoked by Claude Code (not by users). They stay on
# PATH because ~/.claude/settings.json references them by name.
aipager-hook       = "aipager.dtach.notify_hook:main"
aipager-statusline = "aipager.dtach.statusline_notify:main"

[project.urls]
Source    = "https://github.com/dev-aly3n/aipager"
Issues    = "https://github.com/dev-aly3n/aipager/issues"
Changelog = "https://github.com/dev-aly3n/aipager/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# e2e tests drive REAL Claude (claude -p) + the real hook; they need claude
# auth + network + tokens, so they're excluded from the default run and CI.
# Run them with:  pytest -m e2e        (all)
#                 pytest tests/e2e/test_e2e_sticky.py -m e2e   (one file)
# The CLI -m overrides this addopts default.
addopts = "-m 'not e2e'"
markers = [
    "e2e: real-Claude end-to-end safety test (opt-in; needs claude auth + network + tokens)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly. Left implicit, CI installs whatever ruff is
# newest and inherits its defaults — 0.16.0 widened them and turned the
# build red on 351 pre-existing findings with no code change. Widen this
# list deliberately, never as a side effect of a version bump.
select = ["E4", "E7", "E9", "F"]
